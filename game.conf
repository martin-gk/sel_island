title = SEL Island
description = A cooperative Social Emotional Learning world for 9-10 year olds. Five shared activities on one island, guided by the teacher.
author = Martin Guevara-Kunerth
min_minetest_version = 5.9

# --- World generation -------------------------------------------------------
# The island only exists with mapgen v7 and the seed "sel_island".
# The mapgen is locked here; the seed, flags and "no dungeons" are enforced by
# the sel_core mod (see mods/sel/sel_core/world.lua), so we hide those fields
# in the "New world" dialog to avoid confusing the teacher.
allowed_mapgens = v7
default_mapgen = v7
disallowed_mapgen_settings = seed, mg_flags, mgv7_spflags

# --- Main menu checkboxes -----------------------------------------------------
# Children cannot get hurt (no damage) and do not get unlimited blocks
# (no creative mode - the Lake Crossing material roles depend on that).
disabled_settings = enable_damage, creative_mode
