# Game-wide default settings for SEL Island.
# These are defaults: a server's own minetest.conf can still override them.

# Children spawn in the middle of the Hub plaza on the lake island.
# Must match sel_hub's config.lua (HUB.spawn). See docs/WORLD.md.
static_spawnpoint = -680,22,-750

# No damage, no fire spreading, no TNT - a safe classroom world.
enable_damage = false
enable_fire = false
enable_tnt = false

# Players start with empty pockets; activities hand out what is needed.
give_initial_stuff = false

# Always daytime: sel_core sets noon at startup and time stands still.
time_speed = 0
